      /* 顶部导航栏（参考 mars2d-vue-example 的 mars-head 实现） */
      :root {
        --mars-head-height: 68px;
        --mars-head-bg: #256488;
        --mars-head-active: #f08519;
      }

      /* 为固定在顶部的导航栏预留高度 */
      body {
        padding-top: var(--mars-head-height);
      }

      .mars-head {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--mars-head-height);
        background: var(--mars-head-bg);
        z-index: 9999;
        box-sizing: border-box;
      }

      .mars-head-inner {
        width: 90%;
        max-width: 1080px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mars-head-logo {
        display: flex;
        align-items: center;
        flex: none;
        text-decoration: none;
        white-space: nowrap;
      }

      .mars-head-logo img {
        height: 50px;
        border: 0;
      }

      .mars-head-logo-name {
        margin-left: 6px;
        white-space: nowrap;
        font-size: 25px;
        line-height: 24px;
        font-weight: bold;
        color: #ffffff;
      }

      .mars-head-menu {
        display: flex;
        align-items: center;
        flex: none;
      }

      .mars-head-nav {
        display: flex;
        align-items: center;
        margin-left: 56px;
        font-size: 19px;
        line-height: 50px;
        color: #ffffff;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }

      .mars-head-nav svg {
        width: 18px;
        height: 18px;
        margin-right: 4px;
        flex: none;
      }

      .mars-head-nav:hover,
      .mars-head-nav.active {
        color: var(--mars-head-active);
      }

      /* 侧边栏与内容区让出导航栏高度 */
      .main-sidebar,
      .left-side {
        padding-top: var(--mars-head-height);
      }

      .category {
        padding-top: 10px;
      }

      @media screen and (max-width: 992px) {
        :root {
          --mars-head-height: 56px;
        }

        .mars-head-inner {
          width: 100%;
          padding: 0 16px;
        }

        .mars-head-logo img {
          height: 40px;
        }

        .mars-head-logo-name {
          font-size: 20px;
          line-height: 20px;
        }

        .mars-head-nav {
          margin-left: 24px;
          font-size: 16px;
        }

        .mars-head-nav svg {
          width: 16px;
          height: 16px;
        }
      }

      @media screen and (max-width: 640px) {
        .mars-head-logo-name {
          display: none;
        }
      }

      @media screen and (max-width: 480px) {
        .mars-head-nav {
          margin-left: 16px;
          font-size: 14px;
        }

        .mars-head-nav svg {
          display: none;
        }
      }
    </style>
